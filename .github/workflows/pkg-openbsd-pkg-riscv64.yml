#
# Dedicated sub-platform x CPU cloud packaging & Sigstore provenance workflow
# for `cli-openbsd-pkg-riscv64` (`totaldrop-cli-bsd`, ADR 0020).
name: Package (openbsd-pkg / riscv64)

on:
  push:
    tags:
      - "cli-openbsd-pkg-riscv64-v*"
  pull_request:
    paths:
      - "subplatforms/openbsd-pkg/riscv64/**"
      - ".github/workflows/pkg-openbsd-pkg-riscv64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg-openbsd-pkg-riscv64-${{ github.ref }}
  cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/') }}"

jobs:
  package:
    name: Build & Verify (openbsd-pkg / riscv64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated sub-platform recipe (cli-openbsd-pkg-riscv64)
        shell: bash
        run: |
          sh subplatforms/openbsd-pkg/riscv64/build.sh --check-recipe
          sh subplatforms/openbsd-pkg/riscv64/verify.sh --check-recipe
      - name: Stage deterministic sub-platform artifact & SHA256SUMS
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1760000000"
        run: |
          stage_dir="$RUNNER_TEMP/stage-openbsd-pkg-riscv64"
          out_dir="$RUNNER_TEMP/dist-openbsd-pkg-riscv64"
          mkdir -p "$stage_dir" "$out_dir"
          printf 'unit=%s\nsha=%s\n' "cli-openbsd-pkg-riscv64" "$GITHUB_SHA" >"$stage_dir/SOURCE_COMMIT.txt"
          sh subplatforms/openbsd-pkg/riscv64/build.sh --package-staged "$stage_dir" "$out_dir"
          sh subplatforms/openbsd-pkg/riscv64/verify.sh "$out_dir"
      - name: Upload sub-platform artifact & SHA256SUMS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-openbsd-pkg-riscv64
          path: |
            ${{ runner.temp }}/dist-openbsd-pkg-riscv64/totaldrop-openbsd-0.3.0-beta.6-riscv64.tgz
            ${{ runner.temp }}/dist-openbsd-pkg-riscv64/SHA256SUMS
          if-no-files-found: error
      - name: Attest Sigstore OIDC build provenance on release tags
        if: startsWith(github.ref, 'refs/tags/cli-openbsd-pkg-riscv64-v')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/dist-openbsd-pkg-riscv64/totaldrop-openbsd-0.3.0-beta.6-riscv64.tgz
